<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Couple Photography | Andy Tac</title>

  <link rel="stylesheet" href="style.css">
  <style>
  #couple-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  #couple-grid .project-card {
    width: 100%;
  }

  #couple-grid .project-card img {
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 768px) {
    #couple-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">ANDY TAC</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="portrait.html">Portrait</a>
      <a href="couple.html">Couple</a>
    </nav>
  </header>


  <main>

    <section class="portfolio-page">

      <h1>Couple</h1>

      <p class="page-subtitle">
        Couple Photography
      </p>

      <div class="project-grid" id="couple-grid"></div>

    </section>

  </main>


  <script src="projects.js"></script>

  <script>

    const grid = document.getElementById("couple-grid");

    coupleProjects.forEach(project => {

      const card = document.createElement("a");

      card.className = "project-card";

      card.href =
        "project.html?project=" + project.slug;

      card.innerHTML = `
        <img src="${project.cover}" alt="${project.title}">
        <div class="project-info">
          <h2>${project.title}</h2>
        </div>
      `;

      grid.appendChild(card);

    });

  </script>

</body>
</html>
