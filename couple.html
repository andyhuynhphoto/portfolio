<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Couple Photography | Andy Tac</title>

  <link rel="stylesheet" href="style.css">
  <style>
  #couple-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  #couple-grid .project-card {
    position: relative;
    display: block;
    overflow: hidden;
  }

  #couple-grid .project-card img {
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    display: block;
  }

  #couple-grid .project-info {
    position: absolute;
    left: 20px;
    bottom: 18px;
    z-index: 2;
  }

  #couple-grid .project-info h2 {
    margin: 0;
    color: white;
    font-size: 32px;
  }

  #couple-grid .project-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.55),
      rgba(0, 0, 0, 0) 55%
    );
  }

  @media (max-width: 768px) {
    #couple-grid {
      grid-template-columns: 1fr;
    }
  }
.portfolio-page {
  padding: 120px 7% 80px;
}

.portfolio-page > h1 {
  font-size: clamp(70px, 9vw, 140px);
  font-weight: 400;
  line-height: 1;
  margin: 0 0 50px;
  letter-spacing: -4px;
}

.portfolio-page > .page-subtitle {
  font-size: 16px;
  color: #888;
  margin: 0 0 120px;
}

@media (max-width: 768px) {
  .portfolio-page {
    padding: 80px 24px 50px;
  }

  .portfolio-page > h1 {
    font-size: 64px;
    letter-spacing: -2px;
    margin-bottom: 30px;
  }

  .portfolio-page > .page-subtitle {
    margin-bottom: 70px;
  }
}
</style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">ANDY TAC</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="portrait.html">Portrait</a>
      <a href="couple.html">Couple</a>
    </nav>
  </header>


  <main>

    <section class="portfolio-page">

      <h1>Couple</h1>

      <p class="page-subtitle">
        Couple Photography
      </p>

      <div class="project-grid" id="couple-grid"></div>

    </section>

  </main>


  <script src="projects.js"></script>

  <script>

    const grid = document.getElementById("couple-grid");

    coupleProjects.forEach(project => {

      const card = document.createElement("a");

      card.className = "project-card";

      card.href =
        "project.html?project=" + project.slug;

      card.innerHTML = `
        <img src="${project.cover}" alt="${project.title}">
        <div class="project-info">
          <h2>${project.title}</h2>
        </div>
      `;

      grid.appendChild(card);

    });

  </script>

</body>
</html>
