  <script src="projects.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    const slug = params.get("project");


    const allProjects = [
  ...portraitProjects.studio,
  ...portraitProjects.outdoor,
  ...coupleProjects
];


    const project = allProjects.find(
  item => item.slug === slug
);


    if (!project) {

      document.getElementById("project-title").textContent =
        "Project Not Found";

      document.getElementById("project-subtitle").textContent =
        "This project is currently unavailable.";

    } else {

      document.title =
        project.title + " | Andy Tac";

      document.getElementById("project-title").textContent =
        project.title;


      const gallery =
        document.getElementById("project-gallery");


      const folder =
        project.cover.substring(
          0,
          project.cover.lastIndexOf("/")
        );


      for (let i = 1; i <= 50; i++) {

        const image = document.createElement("img");

        const number =
          String(i).padStart(2, "0");

        image.src =
          folder + "/" + number + ".jpeg";

        image.alt =
          project.title + " photography by Andy Tac";

        image.loading = "lazy";


        image.onerror = function() {
          this.remove();
        };


        gallery.appendChild(image);

      }

    }

  </script>
