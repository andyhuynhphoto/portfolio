  <!-- =========================
       CREATE PROJECT CARDS
  ========================== -->

  <script>

    function createProjectCard(project) {

      const card = document.createElement("a");

      card.className = "category";

      card.href =
        "project.html?project=" +
        encodeURIComponent(project.slug);


      const image = document.createElement("img");

      image.src = project.cover;
      image.alt = project.title + " by Andy Tac";
      image.loading = "lazy";


      const title = document.createElement("span");

      title.className = "category-title";
      title.textContent = project.title;


      card.appendChild(image);
      card.appendChild(title);

      return card;
    }



    function loadProjects() {

      const studioContainer =
        document.getElementById("studio-projects");

      const outdoorContainer =
        document.getElementById("outdoor-projects");


      portraitProjects.studio.forEach(project => {

        studioContainer.appendChild(
          createProjectCard(project)
        );

      });


      portraitProjects.outdoor.forEach(project => {

        outdoorContainer.appendChild(
          createProjectCard(project)
        );

      });

    }


    loadProjects();

  </script>
